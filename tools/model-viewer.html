<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIXIN — Lux3D asset viewer (as generated)</title>
<style>
  html, body { margin: 0; height: 100%; background: #6f7378; overflow: hidden; font: 14px/1.5 "SF Mono", Consolas, monospace; color: #111; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #cap { position: fixed; left: 16px; bottom: 12px; background: rgba(255, 255, 255, .78); padding: 6px 10px; }
  #nav { position: fixed; left: 16px; top: 12px; } #nav a { margin-right: 10px; color: #111; background: rgba(255, 255, 255, .78); padding: 4px 8px; text-decoration: none; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }</script>
</head>
<body>
<div id="nav"><a href="?asset=mask">mask</a><a href="?asset=censer">censer</a><a href="?asset=drone">drone</a><a href="?asset=mask&wire">wireframe</a></div>
<div id="cap"></div>
<script type="module">
// Shows one Lux3D-generated GLB exactly as delivered (its own geometry, textures and material; neutral studio light).
// Provenance / report tool only — the main site never loads this page.   ?asset=mask|censer|drone  &wire  &yaw=deg
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search), name = q.get('asset') || 'mask';
const TASK = { mask: 'img-to-3d G1 task 6691940 (from image task 6690690)', censer: 'img-to-3d G1 task 6691965 (from image task 6690707)', drone: 'img-to-3d G1 task 6691979 (from image task 6690729)' };
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x6f7378);
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 3, 4); scene.add(key);
const gltf = await new GLTFLoader().loadAsync(`../assets/${name}.glb`);
const box = new THREE.Box3().setFromObject(gltf.scene), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
let tris = 0, verts = 0; gltf.scene.traverse((o) => { if (o.isMesh) { tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; verts += o.geometry.attributes.position.count; if (q.has('wire')) { o.material = new THREE.MeshBasicMaterial({ color: 0x101418, wireframe: true }); } } });
gltf.scene.position.sub(c); const piv = new THREE.Group(); piv.add(gltf.scene); scene.add(piv);
piv.rotation.y = (Number(q.get('yaw') || 28) * Math.PI) / 180;
const d = Math.max(s.x, s.y, s.z) * 2.5; camera.position.set(0, s.y * 0.12, d); camera.lookAt(0, 0, 0);
document.getElementById('cap').textContent = `${name}.glb — Aholo Lux3D ${TASK[name]} — ${Math.round(tris).toLocaleString()} triangles, ${verts.toLocaleString()} vertices, 2048² textures — shown as generated`;
let drag = null; addEventListener('pointerdown', (e) => { drag = e.clientX; }); addEventListener('pointerup', () => { drag = null; }); addEventListener('pointermove', (e) => { if (drag !== null) { piv.rotation.y += (e.clientX - drag) * 0.01; drag = e.clientX; } });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
renderer.setAnimationLoop(() => renderer.render(scene, camera)); window.__ready = true;
</script>
</body>
</html>
